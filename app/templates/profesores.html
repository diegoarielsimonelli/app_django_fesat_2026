{% extends "base.html" %}

{% block titulo %}Agregar Nuevo profesor{% endblock titulo %}

{% block body %}
<div class="container-box">
    <h2>Agregar Profe Nuevo</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar Profe</button>
    </form>
    <a href="{% url 'profesores' %}" class="btn-link">⬅ Volver al listado</a>
</div>
{% endblock body %}

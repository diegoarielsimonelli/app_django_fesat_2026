[project]
name = "proyecto-django-enclase"
version = "0.1.0"
description = "Add your description here"

readme = "README.md"
authors = [
    { name = "Diego Simonelli", email = "simonellidiego@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "whitenoise>=6.12.0",
]

[project.scripts]
proyecto-django-enclase = "proyecto_django_enclase:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
